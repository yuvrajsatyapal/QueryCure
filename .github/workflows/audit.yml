name: Audit

# Dependency vulnerability audits (DEPLOYMENT §4, SECURITY §9): weekly, on demand, and when a
# lockfile changes. Read-only; nothing is deployed.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ["backend/uv.lock", "frontend/pnpm-lock.yaml"]
  push:
    branches: [main]
    paths: ["backend/uv.lock", "frontend/pnpm-lock.yaml"]

permissions:
  contents: read

jobs:
  python:
    name: pip-audit (backend runtime dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # exact pin: no floating major tag is published
      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --no-hashes --no-emit-project --format requirements-txt > requirements.txt
      - name: pip-audit
        run: uvx pip-audit@2.9.0 -r requirements.txt --no-deps --disable-pip

  node:
    name: pnpm audit (frontend production dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
