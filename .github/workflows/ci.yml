name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # exact pin: no floating major tag is published
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -q -m "not integration"

  backend-integration:
    name: Backend integration (PostgreSQL 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qc_owner
          POSTGRES_PASSWORD: qc_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qc_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Mode C sandbox server (BENCHMARK_ENGINE §3). Service containers take no command line,
      # so the planner settings compose pins with -c are applied with ALTER SYSTEM below.
      sandbox:
        image: postgres:17
        env:
          POSTGRES_USER: qc_sandbox_admin
          POSTGRES_PASSWORD: qc_ci_only
          POSTGRES_DB: sandbox_admin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qc_sandbox_admin -d sandbox_admin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QC_TEST_ADMIN_URL: postgresql://qc_owner:qc_ci_only@127.0.0.1:5432/postgres
      QC_TEST_SANDBOX_URL: postgresql://qc_sandbox_admin:qc_ci_only@127.0.0.1:55432/sandbox_admin
      QC_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # exact pin: no floating major tag is published
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Pin sandbox settings
        run: >-
          psql "$QC_TEST_SANDBOX_URL" -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET jit = off"
          -c "ALTER SYSTEM SET max_parallel_workers_per_gather = 0"
          -c "ALTER SYSTEM SET random_page_cost = 1.1"
          -c "SELECT pg_reload_conf()"
      - name: Integration tests
        run: uv run pytest -q -m integration
      - name: Eval smoke (recorded responses, no model calls)
        run: uv run python -m querycure.evals run --suite smoke --admin-url "$QC_TEST_ADMIN_URL"
      # R19 (ADR-0024): Mode C cases replay from prerecorded measurement fixtures that also
      # hold the recorded sandbox context. No sandbox settings are given on purpose: the step
      # proves these evals touch no sandbox, no benchmark and no model.
      - name: Eval Mode C (recorded responses + prerecorded fixtures, no sandbox)
        run: >-
          uv run python -m querycure.evals run --suite full --measurements fixture
          --case orders_sandbox_composite_index --case rewrite_trap_sandbox
          --admin-url "$QC_TEST_ADMIN_URL"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build the demo-profile images
        run: |
          docker build -q -t querycure-api ../backend
          docker build -q -t querycure-web --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid .

  e2e:
    name: End-to-end (stub LLM, no model calls)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qc_owner
          POSTGRES_PASSWORD: qc_ci_only
          POSTGRES_DB: querycure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qc_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      sandbox:
        image: postgres:17
        env:
          POSTGRES_USER: qc_sandbox_admin
          POSTGRES_PASSWORD: qc_ci_only
          POSTGRES_DB: sandbox_admin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qc_sandbox_admin -d sandbox_admin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SANDBOX_ADMIN_URL: postgresql://qc_sandbox_admin:qc_ci_only@127.0.0.1:55432/sandbox_admin
      SANDBOX_BENCH_PASSWORD: qc_ci_only
      # The UI flow is under test here; role grants are covered by the integration job.
      DATABASE_URL: postgresql://qc_owner:qc_ci_only@127.0.0.1:5432/querycure
      DATABASE_URL_DIRECT: postgresql://qc_owner:qc_ci_only@127.0.0.1:5432/querycure
      DATABASE_MIGRATION_URL: postgresql://qc_owner:qc_ci_only@127.0.0.1:5432/querycure
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # exact pin: no floating major tag is published
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Backend install and migrate
        working-directory: backend
        run: uv sync --locked && uv run alembic upgrade head
      - name: Frontend install
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
