[project]
name = "querycure"
version = "0.1.0"
description = "QueryCure backend: API and worker for multi-agent PostgreSQL performance investigation"
authors = [
    { name = "Yuvraj Satyapal", email = "yuvrajsatyapal21@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "sqlglot>=30.22.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    # Direct use for the GitHub OAuth exchange; already locked as a dependency of openai.
    "httpx>=0.28.1",
    "anyio>=4.15.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests build hostile SQL (S608) and hostile addresses like 0.0.0.0 (S104) on purpose.
"tests/**" = ["S101", "S104", "S311", "S608"]
# Migration SQL reads better unwrapped.
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["querycure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs docker compose databases",
]
