  <title>Investigation graph · QueryCure</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #FAFAF9;
      --color-ink:    #15181D;
      --color-muted:  #566070;
      --color-accent: #0A6F6A;
      --font-sans:    'IBM Plex Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    .frame { max-width: 840px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.5rem; }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; max-width: 70ch; }
    .colophon { font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-muted);
                border-top: 1px solid rgba(21,24,29,0.12); margin-top: 1.5rem; padding-top: 0.75rem; }
    .colophon a { color: #2C5BA8; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
