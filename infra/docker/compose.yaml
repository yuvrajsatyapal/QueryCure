# Local development databases (DEPLOYMENT.md §2). Application processes run on the host for now;
# api/worker containers are added when the worker exists (Phase 2/3).
name: querycure

services:
  metadata-db:
    image: postgres:17
    environment:
      POSTGRES_USER: qc_owner
      POSTGRES_PASSWORD: ${QC_META_PASSWORD:-qc_local_dev_only}
      POSTGRES_DB: querycure
      TZ: UTC
      PGTZ: UTC
      QC_APP_PASSWORD: ${QC_APP_PASSWORD:-qc_local_dev_only}
      QC_RETENTION_PASSWORD: ${QC_RETENTION_PASSWORD:-qc_local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qc_meta:/var/lib/postgresql/data
      # Runs only when the volume is empty; idempotent, so it can also be applied by hand.
      - ./metadata-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_owner -d querycure"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mode C sandbox (SECURITY.md §8). Internal network = no egress and no host port.
  # Nothing uses it until the benchmark engine (Phase 3), when the worker container joins sandbox_net.
  sandbox-db:
    image: postgres:17
    environment:
      POSTGRES_USER: qc_sandbox_admin
      POSTGRES_PASSWORD: ${QC_SANDBOX_PASSWORD:-qc_local_dev_only}
      POSTGRES_DB: sandbox_admin
      TZ: UTC
      PGTZ: UTC
    networks:
      - sandbox_net
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_sandbox_admin -d sandbox_admin"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  sandbox_net:
    internal: true

volumes:
  qc_meta:
