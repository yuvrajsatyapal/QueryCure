# Local profile (DEPLOYMENT.md §2). `docker compose up -d` starts the databases, the relay and the
# worker container, which benchmarks in-network on sandbox_net (ADR-0020). api and web run on the
# host. Host-run worker instead: `docker compose up -d metadata-db sandbox-db sandbox-relay`, then
# run the worker on the host (never both: two workers would split jobs across measurement paths).
name: querycure

services:
  metadata-db:
    image: postgres:17
    environment:
      POSTGRES_USER: qc_owner
      POSTGRES_PASSWORD: ${QC_META_PASSWORD:-qc_local_dev_only}
      POSTGRES_DB: querycure
      TZ: UTC
      PGTZ: UTC
      QC_APP_PASSWORD: ${QC_APP_PASSWORD:-qc_local_dev_only}
      QC_RETENTION_PASSWORD: ${QC_RETENTION_PASSWORD:-qc_local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qc_meta:/var/lib/postgresql/data
      # Runs only when the volume is empty; idempotent, so it can also be applied by hand.
      - ./metadata-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_owner -d querycure"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mode C sandbox (SECURITY.md §8). Internal network = no egress and no host port.
  # Planner/memory settings are pinned here and recorded in every EnvironmentFingerprint
  # (BENCHMARK_ENGINE §3). jit=off: JIT compile time adds variance to short queries.
  sandbox-db:
    image: postgres:17
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - effective_cache_size=1GB
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_connections=40
    environment:
      POSTGRES_USER: qc_sandbox_admin
      POSTGRES_PASSWORD: ${QC_SANDBOX_PASSWORD:-qc_local_dev_only}
      POSTGRES_DB: sandbox_admin
      TZ: UTC
      PGTZ: UTC
    networks:
      - sandbox_net
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_sandbox_admin -d sandbox_admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local profile: the worker and tests run on the host, which cannot join an internal network.
  # This relay forwards one host port (loopback only) to sandbox-db:5432 and nothing else, so
  # sandbox-db itself stays on sandbox_net with no egress. The relay container has a default
  # network for the published port; it runs only socat with a fixed target.
  sandbox-relay:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:sandbox-db:5432"]
    networks:
      - default
      - sandbox_net
    ports:
      - "127.0.0.1:55432:5432"
    depends_on:
      sandbox-db:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 64

  # Default worker (ADR-0020): it reaches the sandbox on sandbox_net directly, without the
  # relay's host<->VM hop. Measured on Docker Desktop (2026-10-12): SELECT 1 round trip 40 us
  # median / 24 us IQR in-network vs 355-451 us / 125-171 us through the published port
  # (ADR-0018). Rebuild after backend changes: `docker compose up -d --build worker`.
  worker:
    build: ../../backend
    environment:
      QC_PROFILE: local
      DATABASE_URL: postgresql://qc_app:${QC_APP_PASSWORD:-qc_local_dev_only}@metadata-db:5432/querycure
      DATABASE_URL_DIRECT: postgresql://qc_app:${QC_APP_PASSWORD:-qc_local_dev_only}@metadata-db:5432/querycure
      SANDBOX_ADMIN_URL: postgresql://qc_sandbox_admin:${QC_SANDBOX_PASSWORD:-qc_local_dev_only}@sandbox-db:5432/sandbox_admin
      SANDBOX_BENCH_PASSWORD: ${SANDBOX_BENCH_PASSWORD:-qc_local_dev_only}
      SANDBOX_IMAGE_DIGEST: postgres:17
      QC_BENCH_PATH: docker-network
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TZ: UTC
    networks:
      - default
      - sandbox_net
    depends_on:
      metadata-db:
        condition: service_healthy
      sandbox-db:
        condition: service_healthy

networks:
  default:
  sandbox_net:
    internal: true

volumes:
  qc_meta:
